<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="duck">
  <title>Polymorph duck</title>
  <style>
    .pm-duck-bob { animation: pm-duck-bob 2.4s ease-in-out infinite; }
    @keyframes pm-duck-bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
  </style>
  <path d="M18 96 Q52 86 90 96 Q128 106 146 96" stroke="#7fb3d5" stroke-width="6" fill="none" stroke-linecap="round" />
  <path d="M28 106 Q60 98 96 106 Q126 114 140 106" stroke="#a9cce3" stroke-width="4" fill="none" stroke-linecap="round" />
  <g class="pm-duck-bob">
    <ellipse cx="86" cy="78" rx="34" ry="20" fill="#f2d26b" />
    <circle cx="52" cy="52" r="20" fill="#f7e08f" />
    <path d="M34 48 Q22 50 20 56 Q24 62 36 60 Z" fill="#e8923f" />
    <circle cx="48" cy="47" r="3.4" fill="#2c2620" />
    <circle cx="49" cy="46" r="1" fill="#ffffff" />
    <path d="M60 76 Q54 66 62 60" stroke="#e3bb4f" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M108 68 Q122 62 130 52" stroke="#e3bb4f" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>
</svg>