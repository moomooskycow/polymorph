<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" role="img" aria-label="wobbling panic face">
  <title>Polymorph tiny panic</title>
  <style>
    .pm-panic-wobble { animation: pm-panic-wobble 0.6s ease-in-out infinite; transform-origin: 80px 62px; }
    @keyframes pm-panic-wobble {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }
    .pm-panic-drip { animation: pm-panic-drip 1.8s ease-in infinite; }
    @keyframes pm-panic-drip {
      0% { opacity: 0; transform: translateY(-4px); }
      30% { opacity: 1; }
      100% { opacity: 0; transform: translateY(10px); }
    }
  </style>
  <g class="pm-panic-wobble">
    <circle cx="80" cy="62" r="38" fill="#f2d9a8" stroke="#2c2620" stroke-width="3" />
    <circle cx="66" cy="54" r="9" fill="#ffffff" stroke="#2c2620" stroke-width="2.5" />
    <circle cx="94" cy="54" r="9" fill="#ffffff" stroke="#2c2620" stroke-width="2.5" />
    <circle cx="66" cy="56" r="3.4" fill="#2c2620" />
    <circle cx="94" cy="56" r="3.4" fill="#2c2620" />
    <ellipse cx="80" cy="80" rx="12" ry="14" fill="#2c2620" />
    <path d="M70 84 Q80 90 90 84" stroke="#d96b6b" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M48 30 Q56 22 66 26 M112 30 Q104 22 94 26" stroke="#c98f5a" stroke-width="4" fill="none" stroke-linecap="round" />
    <circle class="pm-panic-drip" cx="120" cy="30" r="4" fill="#7fb3d5" />
    <circle class="pm-panic-drip" cx="40" cy="24" r="3" fill="#7fb3d5" />
  </g>
</svg>